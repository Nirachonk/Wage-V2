<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMSx vs SAP Matcher</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f5f5f5;padding:20px}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}
button{padding:10px 20px;background:#4c1d95;color:#fff;border:none;border-radius:6px;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ddd;padding:8px}
.match{color:green;font-weight:bold}
.nomatch{color:red;font-weight:bold}
</style>
</head>
<body>

<h2>ระบบเปรียบเทียบ DMSx PDF กับ SAP Excel</h2>

<div class="card">
SAP Excel :
<input type="file" id="sapFile" accept=".xlsx,.xls"><br><br>
DMSx PDF :
<input type="file" id="pdfFile" accept=".pdf"><br><br>
<button onclick="processFiles()">ตรวจสอบข้อมูล</button>
</div>

<div class="card">
SAP: <span id="sapCount">0</span> |
PDF: <span id="pdfCount">0</span> |
ตรงกัน: <span id="matchCount">0</span> |
ไม่ตรงกัน: <span id="misCount">0</span>
</div>

<table id="resultTable">
<thead>
<tr>
<th>หมายเลขผู้ใช้ไฟ</th>
<th>SAP การดำเนินการ</th>
<th>DMSx สถานะล่าสุด</th>
<th>ผล</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

function normalizeStatus(txt){
 txt=(txt||"").toString();
 if(txt.includes("ปลดสาย")) return "ปลดสาย";
 if(txt.includes("ต่อสาย")) return "ต่อสาย";
 if(txt.includes("ผ่อน")) return "ผ่อนผัน";
 return txt.trim();
}

function extractCustomerNo(text){
 let m=String(text||"").match(/\d{12}/);
 return m ? m[0] : "";
}

async function readExcel(file){
 const data=await file.arrayBuffer();
 const wb=XLSX.read(data,{type:'array'});
 const ws=wb.Sheets[wb.SheetNames[0]];
 return XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
}

async function readPdf(file){
 const data=await file.arrayBuffer();
 const pdf=await pdfjsLib.getDocument({data}).promise;

 let txt="";

 for(let p=1;p<=pdf.numPages;p++){
   const page=await pdf.getPage(p);
   const content=await page.getTextContent();
   txt += content.items.map(x=>x.str).join(" ") + "\n";
 }

 return txt;
}

function extractPdfRows(text){

 const rows=[];

 const idRegex=/020\d{9}/g;
 const ids=text.match(idRegex)||[];

 ids.forEach(id=>{

   let pos=text.indexOf(id);
   let area=text.substring(pos,pos+500);

   let status="";

   if(area.includes("ปลดสายแล")) status="ปลดสาย";
   else if(area.includes("ต่อสายแล") || area.includes("ให้ต่อสาย")) status="ต่อสาย";
   else if(area.includes("ผ่อนผัน")) status="ผ่อนผัน";

   rows.push({
      customerNo:id,
      status:status
   });
 });

 const map=new Map();
 rows.forEach(r=>{
   if(r.customerNo && !map.has(r.customerNo)){
      map.set(r.customerNo,r);
   }
 });

 return [...map.values()];
}

async function processFiles(){

 const sap=document.getElementById('sapFile').files[0];
 const pdf=document.getElementById('pdfFile').files[0];

 if(!sap || !pdf){
   alert("กรุณาเลือกไฟล์ SAP และ PDF");
   return;
 }

 const excelRows=await readExcel(sap);
 const pdfText=await readPdf(pdf);
 const pdfRows=extractPdfRows(pdfText);

 let sapData=[];

 for(let i=1;i<excelRows.length;i++){

   const row=excelRows[i];

   const operation=row[3];
   const contract=row[4];

   const customerNo=extractCustomerNo(contract);

   if(customerNo){

      sapData.push({
         customerNo,
         operation:normalizeStatus(operation),
         rawOperation:operation
      });
   }
 }

 const pdfMap=new Map();

 pdfRows.forEach(r=>{
   pdfMap.set(r.customerNo,r);
 });

 let match=0;
 let mismatch=0;

 const tbody=document.querySelector("#resultTable tbody");
 tbody.innerHTML="";

 sapData.forEach(s=>{

   const d=pdfMap.get(s.customerNo);

   if(!d) return;

   const same=s.operation===normalizeStatus(d.status);

   if(same) match++;
   else mismatch++;

   tbody.insertAdjacentHTML("beforeend",
   `<tr>
      <td>${s.customerNo}</td>
      <td>${s.operation}</td>
      <td>${d.status}</td>
      <td class="${same?'match':'nomatch'}">${same?'ตรงกัน':'ไม่ตรงกัน'}</td>
    </tr>`);
 });

 document.getElementById("sapCount").innerText=sapData.length;
 document.getElementById("pdfCount").innerText=pdfRows.length;
 document.getElementById("matchCount").innerText=match;
 document.getElementById("misCount").innerText=mismatch;
}
</script>

</body>
</html>
